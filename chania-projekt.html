<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐈‍⬛😼🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#2B1D12;
    --muted:#9C8A76;
    --amber:#8A5A2B;
    --hair:#E4D9CB;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- HERO: tytuł + licznik ---------- */
  .hero{
    min-height:100svh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:6vh 5vw;
    text-align:center;
  }
  .title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:clamp(1.7rem,4.6vw,3.2rem);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink);
    text-shadow:0 1px 0 rgba(43,29,18,.05);
  }
  .title .dots{color:var(--amber)}
  .since{
    margin-top:.9rem;
    font-size:.72rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .counter{
    margin-top:8vh;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(1.1rem,3.4vw,3rem);
    flex-wrap:wrap;
  }
  .unit{display:flex;flex-direction:column;align-items:center;gap:.55rem}
  .num{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    font-size:clamp(2.6rem,8vw,6.4rem);
    line-height:1;
    letter-spacing:.02em;
  }
  .lbl{
    font-size:.62rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted);
  }
  /* setne — puls strony: mniejsze, cieplejsze */
  .unit.cs .num{
    font-size:clamp(1.7rem,5vw,4rem);
    color:var(--amber);
    font-weight:300;
  }
  .sep{
    font-family:'Space Grotesk',sans-serif;
    font-weight:300;
    font-size:clamp(1.6rem,4.5vw,3.6rem);
    color:var(--hair);
    align-self:center;
    transform:translateY(-.35em);
    user-select:none;
  }

  .scroll-hint{
    margin-top:10vh;
    font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--muted);
    animation:fade 3.2s ease-in-out infinite;
  }
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:.8}}
  @media (prefers-reduced-motion:reduce){.scroll-hint{animation:none}}

  /* ---------- CHANI OF THE DAY ---------- */
  .cotd{
    padding:12vh 5vw 10vh;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
  }
  .cotd-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:.78rem;
    letter-spacing:.36em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5vh;
  }
  .cotd-frame{
    padding:.8rem;
    border:1px solid var(--hair);
    background:#FFFFFF;
    box-shadow:0 40px 70px -30px rgba(43,29,18,.22);
    max-width:620px;
    width:100%;
  }
  .cotd-frame img{
    display:block;width:100%;height:auto;
    max-height:64vh;object-fit:cover;
    border:1px solid var(--hair);
  }

  /* ---------- KOLAŻ ---------- */
  .collage{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-auto-rows:16vw;
    grid-auto-flow:dense;
    gap:0;                 /* zero przerw */
    width:100%;
  }
  .tile{position:relative;overflow:hidden;background:#EFE9E1}
  .tile img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .55s cubic-bezier(.22,1,.36,1);
    transform:scale(1);
    will-change:transform;
  }
  .tile:hover img{transform:scale(1.35)}
  .w2{grid-column:span 2}
  .w3{grid-column:span 3}
  .w6{grid-column:span 6}
  .h2{grid-row:span 2}

  @media (max-width:700px){
    .collage{grid-template-columns:repeat(3,1fr);grid-auto-rows:33vw}
    .w3{grid-column:span 3}
    .w6{grid-column:span 3}
    .sep{display:none}
    .counter{gap:1.4rem}
  }
</style>
</head>
<body>

<header class="hero">
  <h1 class="title">Ile czasu nie widziałem Chani<span class="dots">…</span></h1>
  <p class="since">od 1 października 2024</p>

  <div class="counter" id="counter">
    <div class="unit"><span class="num" id="y">0</span><span class="lbl">lat</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="mo">0</span><span class="lbl">miesięcy</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">dni</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">godzin</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="mi">00</span><span class="lbl">minut</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">sekund</span></div>
    <span class="sep">·</span>
    <div class="unit cs"><span class="num" id="cs">00</span><span class="lbl">setnych</span></div>
  </div>

  <p class="scroll-hint">↓ Chania</p>
</header>

<section class="cotd">
  <p class="cotd-title">Chani of the day</p>
  <div class="cotd-frame">
    <img id="cotd-img" src="" alt="Chania of the day" loading="lazy">
  </div>
</section>

<section class="collage" id="collage">
  <div class="tile w2 h2"><img src="foto/1000094183.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile"><img src="foto/1000096533.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile"><img src="foto/1000097754.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile w2 h2"><img src="foto/1000097956.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile"><img src="foto/1000099029.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile"><img src="foto/1000099270.JPG" alt="Chania" loading="lazy"></div>

  <div class="tile w2"><img src="foto/1000099724.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile w2"><img src="foto/1000099878.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile w2"><img src="foto/1000101409.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile w2"><img src="foto/1000101888.JPG" alt="Chania" loading="lazy"></div>

  <div class="tile h2"><img src="foto/1000105692.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile h2"><img src="foto/1000106094.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile h2"><img src="foto/1000106394.JPG" alt="Chania" loading="lazy"></div>
  <div class="tile h2"><img src="foto/1000107243.JPG" alt="Chania" loading="lazy"></div>

  <div class="tile w2 h2"><img src="foto/1000107886.JPG" alt="Chania" loading="lazy"></div>

  <div class="tile"><img src="foto/IMG_3762.JPG" alt="Chania" loading="lazy"></div>

  <div class="tile h2"><img src="foto/IMG_3764.JPG" alt="Chania" loading="lazy"></div>

  <div class="tile w6"><img src="foto/IMG_3771.JPG" alt="Chania" loading="lazy"></div>
</section>

<script>
  const START = new Date(2024, 9, 1, 0, 0, 0); // 01.10.2024
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  const PHOTOS = [
    "1000094183.JPG","1000096533.JPG","1000097754.JPG","1000097956.JPG","1000099029.JPG","1000099270.JPG",
    "1000099724.JPG","1000099878.JPG","1000101409.JPG","1000101888.JPG","1000102021.JPG","1000102121.JPG",
    "1000104683.JPG","1000104701.JPG","1000105692.JPG","1000106094.JPG","1000106394.JPG","1000107243.JPG",
    "1000107886.JPG","1000115975.JPG","7715a11d-b22b-46f8-84f3-f5a1bfd74b47.JPG","IMG_3761.JPG","IMG_3762.JPG","IMG_3763.JPG",
    "IMG_3764.JPG","IMG_3765.JPG","IMG_3766.JPG","IMG_3767.JPG","IMG_3768.JPG","IMG_3770.JPG","IMG_3771.JPG"
  ];

  (function setPhotoOfTheDay(){
    const now = new Date();
    const key = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
    let hash = 0;
    for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
    $("cotd-img").src = "foto/" + PHOTOS[hash % PHOTOS.length];
  })();

  function plural(n, [one, few, many]){
    if (n === 1) return one;
    const m10 = n % 10, m100 = n % 100;
    if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
    return many;
  }

  function tick(){
    const now = new Date();

    // lata i miesiące — kalendarzowo
    let y = now.getFullYear() - START.getFullYear();
    let mo = now.getMonth() - START.getMonth();
    if (mo < 0) { y--; mo += 12; }
    let anchor = new Date(START); anchor.setFullYear(START.getFullYear() + y); anchor.setMonth(START.getMonth() + mo);
    if (anchor > now) { mo--; if (mo < 0) { mo += 12; y--; } anchor = new Date(START); anchor.setFullYear(START.getFullYear() + y); anchor.setMonth(START.getMonth() + mo); }

    // reszta — z różnicy milisekund
    let ms = now - anchor;
    const d  = Math.floor(ms / 86400000);  ms -= d * 86400000;
    const h  = Math.floor(ms / 3600000);   ms -= h * 3600000;
    const mi = Math.floor(ms / 60000);     ms -= mi * 60000;
    const s  = Math.floor(ms / 1000);      ms -= s * 1000;
    const cs = Math.floor(ms / 10);

    $("y").textContent = y;
    $("y").nextElementSibling.textContent = plural(y, ["rok", "lata", "lat"]);
    $("mo").textContent = mo;
    $("mo").nextElementSibling.textContent = plural(mo, ["miesiąc", "miesiące", "miesięcy"]);
    $("d").textContent = d;
    $("d").nextElementSibling.textContent = plural(d, ["dzień", "dni", "dni"]);
    $("h").textContent = pad(h);
    $("mi").textContent = pad(mi);
    $("s").textContent = pad(s);
    $("cs").textContent = pad(cs);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>

</body>
</html>
