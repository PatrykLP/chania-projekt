<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ile czasu nie widziałem Chani…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050505;
    --ink:#F2EFEA;
    --muted:#6E6862;
    --amber:#D9A441;
    --hair:#1C1A18;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ---------- HERO: tytuł + licznik ---------- */
  .hero{
    min-height:100svh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:6vh 5vw;
    text-align:center;
  }
  .title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-size:clamp(1.7rem,4.6vw,3.2rem);
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#FFFFFF;
    text-shadow:0 0 40px rgba(242,239,234,.14);
  }
  .title .dots{color:var(--amber)}
  .since{
    margin-top:.9rem;
    font-size:.72rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .counter{
    margin-top:8vh;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(1.1rem,3.4vw,3rem);
    flex-wrap:wrap;
  }
  .unit{display:flex;flex-direction:column;align-items:center;gap:.55rem}
  .num{
    font-family:'Space Grotesk',sans-serif;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    font-size:clamp(2.6rem,8vw,6.4rem);
    line-height:1;
    letter-spacing:.02em;
  }
  .lbl{
    font-size:.62rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--muted);
  }
  /* setne — puls strony: mniejsze, cieplejsze */
  .unit.cs .num{
    font-size:clamp(1.7rem,5vw,4rem);
    color:var(--amber);
    font-weight:300;
  }
  .sep{
    font-family:'Space Grotesk',sans-serif;
    font-weight:300;
    font-size:clamp(1.6rem,4.5vw,3.6rem);
    color:var(--hair);
    align-self:center;
    transform:translateY(-.35em);
    user-select:none;
  }

  .scroll-hint{
    margin-top:10vh;
    font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--muted);
    animation:fade 3.2s ease-in-out infinite;
  }
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:.8}}
  @media (prefers-reduced-motion:reduce){.scroll-hint{animation:none}}

  /* ---------- KOLAŻ ---------- */
  .collage{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-auto-rows:16vw;
    grid-auto-flow:dense;
    gap:0;                 /* zero przerw */
    width:100%;
  }
  .tile{position:relative;overflow:hidden;background:#0B0A09}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .w2{grid-column:span 2}
  .w3{grid-column:span 3}
  .h2{grid-row:span 2}

  /* placeholdery — znikną po wstawieniu zdjęć */
  .ph{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    color:#2A2724;
    font-family:'Space Grotesk',sans-serif;
    font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;
    background:linear-gradient(135deg,#0E0D0C,#080807);
    border:1px solid #111;
  }

  @media (max-width:700px){
    .collage{grid-template-columns:repeat(3,1fr);grid-auto-rows:33vw}
    .w3{grid-column:span 3}
    .sep{display:none}
    .counter{gap:1.4rem}
  }
</style>
</head>
<body>

<header class="hero">
  <h1 class="title">Ile czasu nie widziałem Chani<span class="dots">…</span></h1>
  <p class="since">od 1 października 2024</p>

  <div class="counter" id="counter">
    <div class="unit"><span class="num" id="y">0</span><span class="lbl">lat</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="mo">0</span><span class="lbl">miesięcy</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="d">0</span><span class="lbl">dni</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">godzin</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="mi">00</span><span class="lbl">minut</span></div>
    <span class="sep">·</span>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">sekund</span></div>
    <span class="sep">·</span>
    <div class="unit cs"><span class="num" id="cs">00</span><span class="lbl">setnych</span></div>
  </div>

  <p class="scroll-hint">↓ Chania</p>
</header>

<section class="collage" id="collage">
  <div class="tile w2 h2"><div class="ph">zdjęcie 1</div></div>
  <div class="tile"><div class="ph">zdjęcie 2</div></div>
  <div class="tile"><div class="ph">zdjęcie 3</div></div>
  <div class="tile w2"><div class="ph">zdjęcie 4</div></div>
  <div class="tile h2"><div class="ph">zdjęcie 5</div></div>
  <div class="tile"><div class="ph">zdjęcie 6</div></div>
  <div class="tile w2"><div class="ph">zdjęcie 7</div></div>
  <div class="tile"><div class="ph">zdjęcie 8</div></div>
  <div class="tile w2 h2"><div class="ph">zdjęcie 9</div></div>
  <div class="tile"><div class="ph">zdjęcie 10</div></div>
  <div class="tile"><div class="ph">zdjęcie 11</div></div>
  <div class="tile w2"><div class="ph">zdjęcie 12</div></div>
  <div class="tile"><div class="ph">zdjęcie 13</div></div>
  <div class="tile"><div class="ph">zdjęcie 14</div></div>
</section>

<script>
  const START = new Date(2024, 9, 1, 0, 0, 0); // 01.10.2024
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  function tick(){
    const now = new Date();

    // lata i miesiące — kalendarzowo
    let y = now.getFullYear() - START.getFullYear();
    let mo = now.getMonth() - START.getMonth();
    if (mo < 0) { y--; mo += 12; }
    let anchor = new Date(START); anchor.setFullYear(START.getFullYear() + y); anchor.setMonth(START.getMonth() + mo);
    if (anchor > now) { mo--; if (mo < 0) { mo += 12; y--; } anchor = new Date(START); anchor.setFullYear(START.getFullYear() + y); anchor.setMonth(START.getMonth() + mo); }

    // reszta — z różnicy milisekund
    let ms = now - anchor;
    const d  = Math.floor(ms / 86400000);  ms -= d * 86400000;
    const h  = Math.floor(ms / 3600000);   ms -= h * 3600000;
    const mi = Math.floor(ms / 60000);     ms -= mi * 60000;
    const s  = Math.floor(ms / 1000);      ms -= s * 1000;
    const cs = Math.floor(ms / 10);

    $("y").textContent = y;
    $("mo").textContent = mo;
    $("d").textContent = d;
    $("h").textContent = pad(h);
    $("mi").textContent = pad(mi);
    $("s").textContent = pad(s);
    $("cs").textContent = pad(cs);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>

</body>
</html>
